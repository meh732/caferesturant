[package]
name = "arka-pos"
version = "1.2.4"
description = "Arka Restaurant & Fastfood POS System"
authors = ["Arka System"]
edition = "2021"
default-run = "arka-pos"

[lib]
name = "arka_pos_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "arka-pos"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
postgres = { version = "0.19", features = ["with-serde_json-1"], optional = true }

[features]
default = ["server-edition"]
server-edition = ["dep:postgres"]
client-edition = []

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

